[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "vulkan-tesseract"
version = "0.1.0"
description = "GPU-resident neural Carter/CCZ4 spacetime simulation in Slang and Vulkan"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE"]
dependencies = [
    "numpy>=2.3,<3",
]

[project.urls]
Homepage = "https://github.com/rynchpman-cmyk/Vulkan_Tesseract"
Repository = "https://github.com/rynchpman-cmyk/Vulkan_Tesseract"
Issues = "https://github.com/rynchpman-cmyk/Vulkan_Tesseract/issues"

[project.optional-dependencies]
training = [
    "torch>=2.6",
]
shader = [
    "matplotlib==3.10.0",
    "numpy==2.5.1",
    "slangpy==0.43.1",
]

[tool.setuptools]
packages = ["tesseract_nr"]
py-modules = [
    "export_hybrid",
    "export_theory33_frozen_slang",
    "fit_theory33_basin",
    "generate_theory33_kinetic_data",
    "compare_backends",
    "compile_full_slang",
    "hybrid_tesseract",
    "migrate_full_slang",
    "progressive_full_unroll",
    "run_tesseract_nr",
    "run_tesseract",
    "run_tesseract_nr_constrained",
    "run_tesseract_nr_convergence",
    "run_tesseract_nr_frontier",
    "run_tesseract_nr_shocks",
    "run_tesseract_carter_riemann",
    "run_tesseract_neural_phase_riemann",
    "run_vulkan_theory33",
    "run_vulkan_amr",
    "run_vulkan_boundaries",
    "run_vulkan_carter_riemann",
    "run_vulkan_ccz4_fd4",
    "run_vulkan_constrained",
    "run_vulkan_frontier",
    "run_vulkan_frozen_neural",
    "run_vulkan_weno",
    "run_vulkan_carter_eigensystem",
    "run_vulkan_mixed_sources",
    "run_vulkan_full_carter_ccz4",
    "run_vulkan_full_carter_weno",
    "run_vulkan_isolated_ctt",
    "run_vulkan_mixed_proca",
    "run_vulkan_multidimensional",
    "run_vulkan_original_neural_phase_riemann",
    "run_vulkan_original_workflows",
    "run_vulkan_parity",
    "run_vulkan_puncture_mots",
    "run_vulkan_tov",
    "run_theory33_experiments",
    "run_theory33_advanced",
    "run_theory33_hybrid",
    "theory33_advanced",
    "theory33_experiments",
    "theory33_hybrid",
    "theory33_kinetic_data",
    "tesseract_full_stack_visualizer",
    "tesseract_studio",
    "train_hybrid",
    "train_lyapunov_conditioned",
    "visualize_tesseract",
]
